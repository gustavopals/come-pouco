<div
  class="confirm-dialog"
  [class.confirm-dialog-danger]="tone() === 'danger'"
  [class.confirm-dialog-warning]="tone() === 'warning'"
  [class.confirm-dialog-info]="tone() === 'info'"
>
  <div class="confirm-dialog-icon" aria-hidden="true">
    <app-icon [name]="icon()" [size]="22" [strokeWidth]="2"></app-icon>
  </div>

  <div class="confirm-dialog-copy">
    <h2 mat-dialog-title>{{ data.title }}</h2>
    <mat-dialog-content>
      <p>{{ data.message }}</p>
    </mat-dialog-content>
  </div>
</div>

<mat-dialog-actions align="end" class="confirm-dialog-actions">
  <button mat-button type="button" class="confirm-dialog-cancel" (click)="cancel()">
    {{ data.cancelText || 'Cancelar' }}
  </button>
  <button mat-flat-button type="button" class="confirm-dialog-confirm" (click)="confirm()">
    {{ data.confirmText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
