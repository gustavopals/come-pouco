<a class="skip-link" href="#app-content">Pular para conteudo</a>

<section
  class="app-layout"
  [class.app-layout-collapsed]="isSidebarCollapsed()"
  [class.app-layout-mobile]="isMobile()"
  [class.app-layout-drawer-open]="isMobileDrawerOpen()"
>
  <button
    type="button"
    class="app-layout-backdrop"
    *ngIf="isMobileDrawerOpen()"
    aria-label="Fechar menu"
    (click)="closeMobileDrawer()"
  ></button>

  <app-sidebar
    class="app-sidebar-panel"
    [class.app-sidebar-panel-mobile]="isMobile()"
    [class.app-sidebar-panel-open]="isMobileDrawerOpen()"
    [collapsed]="!isMobile() && isSidebarCollapsed()"
    [cdkTrapFocus]="isMobileDrawerOpen()"
    [cdkTrapFocusAutoCapture]="isMobileDrawerOpen()"
    [attr.role]="isMobile() ? 'dialog' : null"
    [attr.aria-modal]="isMobile() && isMobileDrawerOpen() ? 'true' : null"
    [attr.aria-label]="isMobile() ? 'Menu principal' : null"
    (navigate)="closeMobileDrawer()"
  ></app-sidebar>

  <div class="app-layout-main">
    <app-topbar
      [user]="authService.currentUser()"
      [isMobile]="isMobile()"
      [sidebarCollapsed]="isSidebarCollapsed()"
      (openMobileMenu)="openMobileDrawer()"
      (toggleSidebar)="toggleSidebar()"
      (logoutRequested)="logout()"
    >
      <app-breadcrumbs topbar-breadcrumbs></app-breadcrumbs>
    </app-topbar>

    <main
      id="app-content"
      class="app-layout-content"
      tabindex="-1"
      [@.disabled]="prefersReducedMotion()"
      [@routeMotion]="routeAnimation(outlet)"
    >
      <router-outlet #outlet="outlet"></router-outlet>
    </main>
  </div>
</section>
