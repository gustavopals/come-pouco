<app-auth-shell
  title="Recuperar acesso"
  description="Informe o e-mail da conta para receber um link de redefinicao de senha."
  featureTitle="Recuperacao controlada"
  featureDescription="O link de redefinicao expira e mantém o acesso protegido fora do fluxo principal."
  featureIcon="mail"
>
  <ng-container *ngIf="sentEmail$ | async as sentEmail">
    <section class="success-panel" *ngIf="sentEmail; else requestForm">
      <span class="success-icon">
        <app-icon name="mail-check" [size]="24"></app-icon>
      </span>

      <div>
        <h2>Verifique seu e-mail</h2>
        <p>{{ (message$ | async) || 'Se a conta existir, enviaremos as instrucoes.' }}</p>
        <code>{{ sentEmail }}</code>
      </div>

      <div class="auth-actions-row">
        <button
          mat-flat-button
          color="primary"
          type="button"
          [disabled]="isSubmitting$ | async"
          (click)="submit()"
        >
          <app-icon *ngIf="isSubmitting$ | async" name="loader-circle" [size]="18"></app-icon>
          <span>{{ (isSubmitting$ | async) ? 'Reenviando...' : 'Enviar novamente' }}</span>
        </button>
        <button mat-stroked-button type="button" (click)="useAnotherEmail()">
          Usar outro e-mail
        </button>
      </div>

      <a routerLink="/login" class="text-link">Voltar ao login</a>
    </section>

    <ng-template #requestForm>
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="email@dominio.com"
            autocomplete="email"
          />
          <mat-error *ngIf="form.controls.email.touched && form.controls.email.invalid"
            >Informe um e-mail valido.</mat-error
          >
        </mat-form-field>

        <p class="auth-alert auth-alert-error" role="alert" *ngIf="error$ | async as error">
          <app-icon name="circle-alert" [size]="18"></app-icon>
          <span>{{ error }}</span>
        </p>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="auth-submit"
          [disabled]="isSubmitting$ | async"
        >
          <app-icon *ngIf="isSubmitting$ | async" name="loader-circle" [size]="18"></app-icon>
          <span>{{ (isSubmitting$ | async) ? 'Enviando...' : 'Enviar link' }}</span>
        </button>

        <a mat-stroked-button routerLink="/login" class="auth-secondary-action">Voltar ao login</a>
      </form>
    </ng-template>
  </ng-container>
</app-auth-shell>
