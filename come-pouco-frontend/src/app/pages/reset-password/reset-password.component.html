<app-auth-shell
  title="Definir nova senha"
  description="Crie uma senha forte para recuperar o acesso ao painel."
  featureTitle="Conta protegida"
  featureDescription="A nova senha passa a valer imediatamente apos a confirmacao do token."
  featureIcon="key-round"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <mat-form-field appearance="outline">
      <mat-label>Nova senha</mat-label>
      <input
        matInput
        [type]="hidePassword() ? 'password' : 'text'"
        formControlName="newPassword"
        placeholder="Minimo 10 caracteres, letra e numero"
        autocomplete="new-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        class="password-toggle"
        [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'"
        (click)="togglePasswordVisibility()"
      >
        <app-icon [name]="hidePassword() ? 'eye' : 'eye-off'" [size]="18"></app-icon>
      </button>
      <mat-error *ngIf="form.controls.newPassword.touched && form.controls.newPassword.invalid">
        {{ passwordErrorMessage() }}
      </mat-error>
    </mat-form-field>

    <section class="strength-panel" [class]="passwordStrengthClass()">
      <div class="strength-header">
        <span>Forca da senha</span>
        <strong>{{ passwordStrengthLabel() }}</strong>
      </div>
      <div class="strength-track" aria-hidden="true">
        <span [style.width]="passwordStrengthWidth()"></span>
      </div>
      <ul class="strength-checklist">
        <li [class.checklist-ok]="hasMinLength()">
          <app-icon [name]="hasMinLength() ? 'circle-check' : 'circle'" [size]="16"></app-icon>
          10 caracteres ou mais
        </li>
        <li [class.checklist-ok]="hasLetter()">
          <app-icon [name]="hasLetter() ? 'circle-check' : 'circle'" [size]="16"></app-icon>
          Ao menos 1 letra
        </li>
        <li [class.checklist-ok]="hasNumber()">
          <app-icon [name]="hasNumber() ? 'circle-check' : 'circle'" [size]="16"></app-icon>
          Ao menos 1 numero
        </li>
        <li [class.checklist-ok]="hasNoSpaces()">
          <app-icon [name]="hasNoSpaces() ? 'circle-check' : 'circle'" [size]="16"></app-icon>
          Sem espacos
        </li>
        <li [class.checklist-ok]="hasNoObviousPattern()">
          <app-icon
            [name]="hasNoObviousPattern() ? 'circle-check' : 'circle'"
            [size]="16"
          ></app-icon>
          Sem sequencias obvias
        </li>
      </ul>
    </section>

    <p
      class="auth-alert auth-alert-success"
      role="status"
      aria-live="polite"
      *ngIf="message$ | async as message"
    >
      <app-icon name="circle-check" [size]="18"></app-icon>
      <span>{{ message }}</span>
    </p>
    <p class="auth-alert auth-alert-error" role="alert" *ngIf="error$ | async as error">
      <app-icon name="circle-alert" [size]="18"></app-icon>
      <span>{{ error }}</span>
    </p>

    <button
      mat-flat-button
      color="primary"
      type="submit"
      class="auth-submit"
      [disabled]="isSubmitting$ | async"
    >
      <app-icon *ngIf="isSubmitting$ | async" name="loader-circle" [size]="18"></app-icon>
      <span>{{ (isSubmitting$ | async) ? 'Salvando...' : 'Redefinir senha' }}</span>
    </button>

    <a mat-stroked-button routerLink="/login" class="auth-secondary-action">Voltar ao login</a>
  </form>
</app-auth-shell>
