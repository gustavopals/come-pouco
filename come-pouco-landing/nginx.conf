server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para text/* e assets clássicos
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Cabeçalhos de segurança padrões.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Cache forte em assets versionados (Astro emite com hash em _astro/).
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache moderado em assets estáticos não versionados.
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|avif|woff2|woff|ttf)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # robots.txt / sitemap / manifest sempre frescos.
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap-index.xml { try_files $uri =404; }
    location = /sitemap-0.xml { try_files $uri =404; }
    location = /manifest.json { try_files $uri =404; }

    # HTML: sempre revalida (Astro estático mas conteúdo pode mudar a cada deploy).
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # 404 estilizado (Astro gera dist/404.html).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
