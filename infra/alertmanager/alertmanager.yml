global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: discord-alerts
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 15m

receivers:
  - name: discord-alerts
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        send_resolved: true
        username: Come Pouco Alerts
        title: '{{ template "come-pouco.discord.title" . }}'
        message: '{{ template "come-pouco.discord.message" . }}'
