global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: come-pouco
    environment: development

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: come-pouco-backend
    metrics_path: /api/metrics
    scheme: http
    basic_auth:
      username: metrics
      password: metrics-dev-change-me
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: backend

  - job_name: come-pouco-backend-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://host.docker.internal:3000/api/health
        labels:
          service: backend
          probe: liveness
      - targets:
          - http://host.docker.internal:3000/api/health/ready
        labels:
          service: backend
          probe: readiness
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

remote_write:
  - url: http://openobserve:5080/api/default/prometheus/api/v1/write
    queue_config:
      max_samples_per_send: 10000
    basic_auth:
      username: root@example.com
      password: Complexpass#123
